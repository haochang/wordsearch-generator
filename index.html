<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Word Search Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lexend:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Lexend', sans-serif;
      color: #1e293b;
      background-color: #f1f5f9;
    }
    
    .font-heading {
      font-family: 'Fredoka', sans-serif;
    }

    .word-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      user-select: none;
      transition: all 0.15s ease;
    }

    /* Style variants for Black & White vs Playful Color */
    .style-bw .word-cell {
      border: 1px solid #000000;
      background-color: #ffffff;
      color: #000000;
    }

    .style-bw .word-cell.found {
      background-color: #e5e7eb !important;
      color: #000000 !important;
      font-weight: 900 !important;
      outline: 2px solid #000000;
      z-index: 10;
    }

    .style-color .word-cell {
      border: 1px solid var(--theme-border-light, #cbd5e1);
      background-color: #ffffff;
      color: var(--theme-text-dark, #0f172a);
    }

    .style-color .word-cell.found {
      background-color: var(--theme-highlight-bg, #fef08a) !important;
      color: var(--theme-highlight-text, #854d0e) !important;
      font-weight: 900 !important;
      outline: 2px solid var(--theme-border-main, #0284c7);
      z-index: 10;
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: #ffffff !important;
        padding: 0 !important;
      }
      .page-break {
        page-break-after: always;
        break-after: page;
      }
      .word-cell {
        font-size: 1rem !important;
      }
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- TOP CONTROL PANEL (HIDDEN IN PRINT) -->
  <div class="no-print max-w-4xl mx-auto mb-8 bg-white p-6 rounded-2xl border-2 border-slate-900 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
    <div class="flex items-center justify-between border-b-2 border-slate-900 pb-4 mb-6">
      <h1 class="text-2xl font-bold font-heading text-slate-900 flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> Custom Word Search Generator
      </h1>
      <button onclick="window.print()" class="bg-indigo-600 text-white hover:bg-indigo-700 font-bold py-2.5 px-5 rounded-xl flex items-center gap-2 border-2 border-slate-900 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition">
        <i class="fa-solid fa-print"></i> Print / Save as PDF
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- INPUT WORDS -->
      <div>
        <label class="block font-bold text-slate-800 mb-2">Enter Words (Comma or line separated):</label>
        <textarea id="wordsInput" rows="7" class="w-full p-3 border-2 border-slate-900 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL">KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL</textarea>
        
        <div class="mt-2 flex flex-wrap gap-2">
          <span class="text-xs font-bold text-slate-600 self-center">Presets:</span>
          <button onclick="loadPreset('year2')" class="text-xs bg-slate-100 hover:bg-slate-200 font-bold py-1 px-2.5 rounded-lg border border-slate-800">Year 2 Spelling</button>
          <button onclick="loadPreset('phonics')" class="text-xs bg-slate-100 hover:bg-slate-200 font-bold py-1 px-2.5 rounded-lg border border-slate-800">Phase 5 Phonics</button>
          <button onclick="loadPreset('animals')" class="text-xs bg-slate-100 hover:bg-slate-200 font-bold py-1 px-2.5 rounded-lg border border-slate-800">Animals</button>
        </div>
      </div>

      <!-- OPTIONS -->
      <div class="flex flex-col justify-between space-y-3">
        <div>
          <label class="block font-bold text-slate-800 mb-1 text-sm">Number of Puzzles:</label>
          <select id="sheetCount" class="w-full p-2 border-2 border-slate-900 rounded-xl mb-3 font-bold bg-white text-sm">
            <option value="1">1 Puzzle</option>
            <option value="3">3 Themed Puzzles</option>
            <option value="5" selected>5 Themed Puzzles</option>
          </select>

          <div class="grid grid-cols-3 gap-2 mb-3">
            <div>
              <label class="block font-bold text-slate-800 mb-1 text-xs">Print Theme:</label>
              <select id="colorMode" class="w-full p-2 border-2 border-slate-900 rounded-xl font-bold bg-white text-xs">
                <option value="color" selected>Playful Color</option>
                <option value="bw">Black & White</option>
              </select>
            </div>
            <div>
              <label class="block font-bold text-slate-800 mb-1 text-xs">Grid Size:</label>
              <select id="gridSize" class="w-full p-2 border-2 border-slate-900 rounded-xl font-bold bg-white text-xs">
                <option value="12">12 x 12 (Easier)</option>
                <option value="15" selected>15 x 15 (Standard)</option>
              </select>
            </div>
            <div>
              <label class="block font-bold text-slate-800 mb-1 text-xs">Letter Case:</label>
              <select id="letterCase" class="w-full p-2 border-2 border-slate-900 rounded-xl font-bold bg-white text-xs">
                <option value="upper" selected>UPPERCASE</option>
                <option value="lower">lowercase</option>
              </select>
            </div>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button onclick="generateSheets()" class="flex-1 bg-slate-900 text-white font-bold py-3 px-4 rounded-xl border-2 border-slate-900 hover:bg-slate-800 transition shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
            <i class="fa-solid fa-rotate"></i> Generate Puzzles
          </button>
          <button id="ansBtn" onclick="toggleAnswers()" class="bg-slate-200 text-slate-900 font-bold py-3 px-4 rounded-xl border-2 border-slate-900 hover:bg-slate-300">
            Show Answers
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTAINER FOR GENERATED PUZZLES -->
  <div id="sheetsContainer" class="max-w-3xl mx-auto space-y-8"></div>

  <script>
    const THEMES = [
      { 
        name: "Jungle Safari", 
        icon: "fa-compass", 
        desc: "Search through the wild jungle!",
        headerBg: "bg-emerald-600",
        headerText: "text-white",
        badgeBg: "bg-emerald-800 text-emerald-100",
        borderMain: "#059669",
        borderLight: "#a7f3d0",
        textDark: "#064e3b",
        highlightBg: "#fef08a",
        highlightText: "#854d0e"
      },
      { 
        name: "Space Explorer", 
        icon: "fa-rocket", 
        desc: "Find hidden words in the stars!",
        headerBg: "bg-indigo-700",
        headerText: "text-white",
        badgeBg: "bg-indigo-900 text-indigo-100",
        borderMain: "#4338ca",
        borderLight: "#c7d2fe",
        textDark: "#1e1b4b",
        highlightBg: "#fef08a",
        highlightText: "#854d0e"
      },
      { 
        name: "Under the Sea", 
        icon: "fa-water", 
        desc: "Dive deep into the ocean grid!",
        headerBg: "bg-sky-600",
        headerText: "text-white",
        badgeBg: "bg-sky-800 text-sky-100",
        borderMain: "#0284c7",
        borderLight: "#bae6fd",
        textDark: "#0c4a6e",
        highlightBg: "#fef08a",
        highlightText: "#854d0e"
      },
      { 
        name: "Detective Sleuth", 
        icon: "fa-magnifying-glass", 
        desc: "Solve the mystery word search!",
        headerBg: "bg-amber-600",
        headerText: "text-white",
        badgeBg: "bg-amber-800 text-amber-100",
        borderMain: "#d97706",
        borderLight: "#fde68a",
        textDark: "#78350f",
        highlightBg: "#fef08a",
        highlightText: "#854d0e"
      },
      { 
        name: "Castle & Knights", 
        icon: "fa-shield-halved", 
        desc: "A quest for secret spellings!",
        headerBg: "bg-rose-700",
        headerText: "text-white",
        badgeBg: "bg-rose-900 text-rose-100",
        borderMain: "#be123c",
        borderLight: "#fecdd3",
        textDark: "#881337",
        highlightBg: "#fef08a",
        highlightText: "#854d0e"
      }
    ];

    let showAnswers = false;

    const PRESETS = {
      year2: "KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL",
      phonics: "CAMEL, TUNNEL, SQUIRREL, DOLPHIN, PHONICS, ELEPHANT, NEPHEW, TROPHY",
      animals: "TIGER, GIRAFFE, ELEPHANT, MONKEY, PANDA, KANGAROO, ZEBRA, LION"
    };

    function loadPreset(key) {
      document.getElementById('wordsInput').value = PRESETS[key];
      generateSheets();
    }

    function toggleAnswers() {
      showAnswers = !showAnswers;
      const btn = document.getElementById('ansBtn');
      btn.innerText = showAnswers ? "Hide Answers" : "Show Answers";
      btn.className = showAnswers 
        ? "bg-slate-900 text-white font-bold py-3 px-4 rounded-xl border-2 border-slate-900" 
        : "bg-slate-200 text-slate-900 font-bold py-3 px-4 rounded-xl border-2 border-slate-900 hover:bg-slate-300";
      
      document.querySelectorAll('.word-cell').forEach(cell => {
        if (cell.dataset.isWord === "true") {
          cell.classList.toggle('found', showAnswers);
        }
      });
    }

    function parseWords(isLower) {
      const raw = document.getElementById('wordsInput').value;
      return raw
        .split(/[\n,]+/)
        .map(w => {
          let cleaned = w.trim().replace(/[^a-zA-Z]/g, '');
          return isLower ? cleaned.toLowerCase() : cleaned.toUpperCase();
        })
        .filter(w => w.length > 1 && w.length <= 15);
    }

    function createEmptyGrid(size) {
      return Array(size).fill(null).map(() => Array(size).fill(''));
    }

    function placeWord(grid, solutionMask, word) {
      const size = grid.length;
      const directions = [
        { r: 0, c: 1 },  // Horizontal
        { r: 1, c: 0 }   // Vertical
      ];

      let placed = false;
      let attempts = 0;

      while (!placed && attempts < 100) {
        attempts++;
        const dir = directions[Math.floor(Math.random() * directions.length)];
        const startR = Math.floor(Math.random() * (dir.r === 1 ? size - word.length + 1 : size));
        const startC = Math.floor(Math.random() * (dir.c === 1 ? size - word.length + 1 : size));

        let canPlace = true;
        for (let i = 0; i < word.length; i++) {
          const r = startR + i * dir.r;
          const c = startC + i * dir.c;
          if (grid[r][c] !== '' && grid[r][c] !== word[i]) {
            canPlace = false;
            break;
          }
        }

        if (canPlace) {
          for (let i = 0; i < word.length; i++) {
            const r = startR + i * dir.r;
            const c = startC + i * dir.c;
            grid[r][c] = word[i];
            solutionMask[r][c] = true;
          }
          placed = true;
        }
      }
      return placed;
    }

    function fillRandomLetters(grid, isLower) {
      const letters = isLower ? "abcdefghijklmnopqrstuvwxyz" : "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const size = grid.length;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (grid[r][c] === '') {
            grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }
    }

    function generateSheets() {
      const colorMode = document.getElementById('colorMode').value;
      const isColor = colorMode === 'color';
      const letterCase = document.getElementById('letterCase').value;
      const isLower = letterCase === 'lower';
      const words = parseWords(isLower);
      const count = parseInt(document.getElementById('sheetCount').value);
      const size = parseInt(document.getElementById('gridSize').value);
      const container = document.getElementById('sheetsContainer');

      if (words.length === 0) {
        alert("Please enter at least one valid word!");
        return;
      }

      container.innerHTML = '';

      for (let s = 0; s < count; s++) {
        const theme = THEMES[s % THEMES.length];
        const grid = createEmptyGrid(size);
        const solutionMask = createEmptyGrid(size).map(r => r.map(() => false));

        const placedWords = [];
        words.forEach(word => {
          if (placeWord(grid, solutionMask, word)) {
            placedWords.push(word);
          }
        });

        fillRandomLetters(grid, isLower);

        // Build HTML
        const sheetEl = document.createElement('div');
        sheetEl.className = `bg-white p-6 rounded-2xl page-break mb-8 ${isColor ? 'style-color border-4' : 'style-bw border-4 border-black'}`;
        
        if (isColor) {
          sheetEl.style.borderColor = theme.borderMain;
          sheetEl.style.setProperty('--theme-border-main', theme.borderMain);
          sheetEl.style.setProperty('--theme-border-light', theme.borderLight);
          sheetEl.style.setProperty('--theme-text-dark', theme.textDark);
          sheetEl.style.setProperty('--theme-highlight-bg', theme.highlightBg);
          sheetEl.style.setProperty('--theme-highlight-text', theme.highlightText);
        }

        let gridHtml = `<div class="grid gap-1 mb-6" style="grid-template-columns: repeat(${size}, minmax(0, 1fr));">`;
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const isWord = solutionMask[r][c];
            const isFoundClass = (isWord && showAnswers) ? 'found' : '';
            gridHtml += `<div class="word-cell rounded-md ${isFoundClass}" data-is-word="${isWord}">${grid[r][c]}</div>`;
          }
        }
        gridHtml += `</div>`;

        let listBorder = isColor ? `style="border-color: ${theme.borderLight}; background-color: #f8fafc;"` : 'class="border-2 border-black p-4 rounded-xl bg-gray-50"';
        let wordsListHtml = `<div ${isColor ? `class="grid grid-cols-3 gap-3 border-2 p-4 rounded-xl" ${listBorder}` : listBorder}>`;
        placedWords.forEach(w => {
          let boxBorder = isColor ? `style="border-color: ${theme.borderMain};"` : 'class="w-4 h-4 border-2 border-black rounded bg-white"';
          wordsListHtml += `
            <div class="flex items-center gap-2 font-bold text-sm">
              <div ${isColor ? `class="w-4 h-4 border-2 rounded bg-white" ${boxBorder}` : boxBorder}></div>
              <span>${w}</span>
            </div>`;
        });
        wordsListHtml += `</div>`;

        let headerStyle = isColor 
          ? `${theme.headerBg} ${theme.headerText} p-4 rounded-xl mb-6 flex justify-between items-center` 
          : 'border-b-4 border-black pb-4 mb-4 flex justify-between items-end';

        sheetEl.innerHTML = `
          <!-- HEADER -->
          <div class="${headerStyle}">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider ${isColor ? theme.badgeBg : 'bg-black text-white'} px-2.5 py-1 rounded-md">Year 2 Activity Sheet</span>
              <h2 class="text-2xl font-black font-heading flex items-center gap-2 mt-2">
                <i class="fa-solid ${theme.icon}"></i> ${theme.name} Word Search
              </h2>
              <p class="text-xs font-semibold ${isColor ? 'text-white/80' : 'text-gray-600'} mt-0.5">${theme.desc}</p>
            </div>
            <div class="text-right border-2 ${isColor ? 'border-white/40 bg-white/10' : 'border-black'} p-2.5 rounded-xl text-xs font-bold">
              <div>Name: ____________________</div>
              <div class="mt-1.5">Date: ____________________</div>
            </div>
          </div>

          <!-- GRID -->
          ${gridHtml}

          <!-- WORD LIST -->
          <div class="mt-4">
            <h3 class="font-bold text-sm mb-2 font-heading flex items-center gap-1 text-slate-800">
              <i class="fa-solid fa-list-check"></i> WORDS TO FIND (${placedWords.length}):
            </h3>
            ${wordsListHtml}
          </div>
        `;

        container.appendChild(sheetEl);
      }
    }

    // Initialize on load
    window.onload = generateSheets;
  </script>
</body>
</html>
