<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Word Search Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lexend:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Lexend', sans-serif;
      color: #000;
      background-color: #f8fafc;
    }
    
    .font-heading {
      font-family: 'Fredoka', sans-serif;
    }

    .word-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      user-select: none;
      border: 1px solid #000000;
      background-color: #ffffff;
      color: #000000;
    }

    .word-cell.found {
      background-color: #e5e7eb !important;
      color: #000000 !important;
      font-weight: 900 !important;
      outline: 2px solid #000000;
      z-index: 10;
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: #ffffff !important;
        padding: 0 !important;
      }
      .page-break {
        page-break-after: always;
        break-after: page;
      }
      .print-border {
        border: 2px solid #000000 !important;
      }
      .word-cell {
        font-size: 1rem !important;
        border-color: #000000 !important;
      }
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- TOP CONTROL PANEL (HIDDEN IN PRINT) -->
  <div class="no-print max-w-4xl mx-auto mb-8 bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
    <div class="flex items-center justify-between border-b-2 border-black pb-4 mb-6">
      <h1 class="text-2xl font-bold font-heading flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Custom Word Search Generator
      </h1>
      <button onclick="window.print()" class="bg-black text-white hover:bg-gray-800 font-bold py-2 px-4 rounded-lg flex items-center gap-2 border-2 border-black">
        <i class="fa-solid fa-print"></i> Print / Save as PDF
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- INPUT WORDS -->
      <div>
        <label class="block font-bold mb
