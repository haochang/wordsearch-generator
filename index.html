<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Word Search Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lexend:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Lexend', sans-serif;
      color: #000;
      background-color: #f8fafc;
    }
    
    .font-heading {
      font-family: 'Fredoka', sans-serif;
    }

    .word-grid-15 {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      gap: 2px;
    }

    .word-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      user-select: none;
      border: 1px solid #000000;
      background-color: #ffffff;
      color: #000000;
    }

    .word-cell.found {
      background-color: #e5e7eb !important;
      color: #000000 !important;
      font-weight: 900 !important;
      outline: 2px solid #000000;
      z-index: 10;
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: #ffffff !important;
        padding: 0 !important;
      }
      .page-break {
        page-break-after: always;
        break-after: page;
      }
      .print-border {
        border: 2px solid #000000 !important;
      }
      .word-cell {
        font-size: 1rem !important;
        border-color: #000000 !important;
      }
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- TOP CONTROL PANEL (HIDDEN IN PRINT) -->
  <div class="no-print max-w-4xl mx-auto mb-8 bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
    <div class="flex items-center justify-between border-b-2 border-black pb-4 mb-6">
      <h1 class="text-2xl font-bold font-heading flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Custom Word Search Generator
      </h1>
      <button onclick="window.print()" class="bg-black text-white hover:bg-gray-800 font-bold py-2 px-4 rounded-lg flex items-center gap-2 border-2 border-black">
        <i class="fa-solid fa-print"></i> Print / Save as PDF
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- INPUT WORDS -->
      <div>
        <label class="block font-bold mb-2">Enter Words (Comma or line separated):</label>
        <textarea id="wordsInput" rows="6" class="w-full p-3 border-2 border-black rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-black" placeholder="KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL">KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL</textarea>
        
        <div class="mt-2 flex flex-wrap gap-2">
          <span class="text-xs font-bold self-center">Presets:</span>
          <button onclick="loadPreset('year2')" class="text-xs bg-gray-200 hover:bg-gray-300 font-bold py-1 px-2 rounded border border-black">Year 2 Spelling</button>
          <button onclick="loadPreset('phonics')" class="text-xs bg-gray-200 hover:bg-gray-300 font-bold py-1 px-2 rounded border border-black">Phase 5 Phonics</button>
          <button onclick="loadPreset('animals')" class="text-xs bg-gray-200 hover:bg-gray-300 font-bold py-1 px-2 rounded border border-black">Animals</button>
        </div>
      </div>

      <!-- OPTIONS -->
      <div class="flex flex-col justify-between">
        <div>
          <label class="block font-bold mb-2">Number of Puzzles to Generate:</label>
          <select id="sheetCount" class="w-full p-2 border-2 border-black rounded-lg mb-4 font-bold bg-white">
            <option value="1">1 Puzzle</option>
            <option value="3">3 Themed Puzzles</option>
            <option value="5" selected>5 Themed Puzzles</option>
          </select>

          <label class="block font-bold mb-2">Grid Size:</label>
          <select id="gridSize" class="w-full p-2 border-2 border-black rounded-lg mb-4 font-bold bg-white">
            <option value="12">12 x 12 (Easier)</option>
            <option value="15" selected>15 x 15 (Standard)</option>
          </select>
        </div>

        <div class="flex gap-3">
          <button onclick="generateSheets()" class="flex-1 bg-black text-white font-bold py-3 px-4 rounded-lg border-2 border-black hover:bg-gray-800 transition">
            <i class="fa-solid fa-rotate"></i> Generate Puzzles
          </button>
          <button id="ansBtn" onclick="toggleAnswers()" class="bg-gray-200 text-black font-bold py-3 px-4 rounded-lg border-2 border-black hover:bg-gray-300">
            Show Answers
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTAINER FOR GENERATED PUZZLES -->
  <div id="sheetsContainer" class="max-w-3xl mx-auto space-y-8"></div>

  <script>
    const THEMES = [
      { name: "Jungle Safari", icon: "fa-compass", desc: "Search through the wild jungle!" },
      { name: "Space Explorer", icon: "fa-rocket", desc: "Find hidden words in the stars!" },
      { name: "Under the Sea", icon: "fa-water", desc: "Dive deep into the ocean grid!" },
      { name: "Detective Sleuth", icon: "fa-magnifying-glass", desc: "Solve the mystery word search!" },
      { name: "Castle & Knights", icon: "fa-shield-halved", desc: "A quest for secret spellings!" }
    ];

    let showAnswers = false;

    const PRESETS = {
      year2: "KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL",
      phonics: "CAMEL, TUNNEL, SQUIRREL, DOLPHIN, PHONICS, ELEPHANT, NEPHEW, TROPHY",
      animals: "TIGER, GIRAFFE, ELEPHANT, MONKEY, PANDA, KANGAROO, ZEBRA, LION"
    };

    function loadPreset(key) {
      document.getElementById('wordsInput').value = PRESETS[key];
      generateSheets();
    }

    function toggleAnswers() {
      showAnswers = !showAnswers;
      const btn = document.getElementById('ansBtn');
      btn.innerText = showAnswers ? "Hide Answers" : "Show Answers";
      btn.className = showAnswers 
        ? "bg-black text-white font-bold py-3 px-4 rounded-lg border-2 border-black" 
        : "bg-gray-200 text-black font-bold py-3 px-4 rounded-lg border-2 border-black hover:bg-gray-300";
      
      document.querySelectorAll('.word-cell').forEach(cell => {
        if (cell.dataset.isWord === "true") {
          cell.classList.toggle('found', showAnswers);
        }
      });
    }

    function parseWords() {
      const raw = document.getElementById('wordsInput').value;
      return raw
        .split(/[\n,]+/)
        .map(w => w.trim().toUpperCase().replace(/[^A-Z]/g, ''))
        .filter(w => w.length > 1 && w.length <= 15);
    }

    function createEmptyGrid(size) {
      return Array(size).fill(null).map(() => Array(size).fill(''));
    }

    function placeWord(grid, solutionMask, word) {
      const size = grid.length;
      const directions = [
        { r: 0, c: 1 },  // Horizontal
        { r: 1, c: 0 }   // Vertical
      ];

      let placed = false;
      let attempts = 0;

      while (!placed && attempts < 100) {
        attempts++;
        const dir = directions[Math.floor(Math.random() * directions.length)];
        const startR = Math.floor(Math.random() * (dir.r === 1 ? size - word.length + 1 : size));
        const startC = Math.floor(Math.random() * (dir.c === 1 ? size - word.length + 1 : size));

        let canPlace = true;
        for (let i = 0; i < word.length; i++) {
          const r = startR + i * dir.r;
          const c = startC + i * dir.c;
          if (grid[r][c] !== '' && grid[r][c] !== word[i]) {
            canPlace = false;
            break;
          }
        }

        if (canPlace) {
          for (let i = 0; i < word.length; i++) {
            const r = startR + i * dir.r;
            const c = startC + i * dir.c;
            grid[r][c] = word[i];
            solutionMask[r][c] = true;
          }
          placed = true;
        }
      }
      return placed;
    }

    function fillRandomLetters(grid) {
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const size = grid.length;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (grid[r][c] === '') {
            grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }
    }

    function generateSheets() {
      const words = parseWords();
      const count = parseInt(document.getElementById('sheetCount').value);
      const size = parseInt(document.getElementById('gridSize').value);
      const container = document.getElementById('sheetsContainer');

      if (words.length === 0) {
        alert("Please enter at least one valid word!");
        return;
      }

      container.innerHTML = '';

      for (let s = 0; s < count; s++) {
        const theme = THEMES[s % THEMES.length];
        const grid = createEmptyGrid(size);
        const solutionMask = createEmptyGrid(size).map(r => r.map(() => false));

        const placedWords = [];
        words.forEach(word => {
          if (placeWord(grid, solutionMask, word)) {
            placedWords.push(word);
          }
        });

        fillRandomLetters(grid);

        // Build HTML
        const sheetEl = document.createElement('div');
        sheetEl.className = "bg-white p-6 border-4 border-black rounded-xl page-break mb-8 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]";

        let gridHtml = `<div class="grid gap-1 mb-6" style="grid-template-columns: repeat(${size}, minmax(0, 1fr));">`;
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const isWord = solutionMask[r][c];
            const isFoundClass = (isWord && showAnswers) ? 'found' : '';
            gridHtml += `<div class="word-cell rounded ${isFoundClass}" data-is-word="${isWord}">${grid[r][c]}</div>`;
          }
        }
        gridHtml += `</div>`;

        let wordsListHtml = `<div class="grid grid-cols-3 gap-3 border-2 border-black p-4 rounded-lg bg-gray-50">`;
        placedWords.forEach(w => {
          wordsListHtml += `
            <div class="flex items-center gap-2 font-bold text-sm">
              <div class="w-4 h-4 border-2 border-black rounded-sm bg-white"></div>
              <span>${w}</span>
            </div>`;
        });
        wordsListHtml += `</div>`;

        sheetEl.innerHTML = `
          <!-- HEADER -->
          <div class="border-b-4 border-black pb-4 mb-4 flex justify-between items-end">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider bg-black text-white px-2 py-0.5 rounded">Year 2 Activity Sheet</span>
              <h2 class="text-2xl font-black font-heading flex items-center gap-2 mt-1">
                <i class="fa-solid ${theme.icon}"></i> ${theme.name} Word Search
              </h2>
              <p class="text-xs font-bold text-gray-600">${theme.desc}</p>
            </div>
            <div class="text-right border-2 border-black p-2 rounded-lg text-xs font-bold">
              <div>Name: ____________________</div>
              <div class="mt-1">Date: ____________________</div>
            </div>
          </div>

          <!-- GRID -->
          ${gridHtml}

          <!-- WORD LIST -->
          <div class="mt-4">
            <h3 class="font-bold text-sm mb-2 font-heading flex items-center gap-1">
              <i class="fa-solid fa-list-check"></i> WORDS TO FIND (${placedWords.length}):
            </h3>
            ${wordsListHtml}
          </div>
        `;

        container.appendChild(sheetEl);
      }
    }

    // Initialize on load
    window.onload = generateSheets;
  </script>
</body>
</html>
