<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Word Search Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lexend:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Lexend', sans-serif;
      color: #000;
      background-color: #f8fafc;
    }
    
    .font-heading {
      font-family: 'Fredoka', sans-serif;
    }

    .word-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      user-select: none;
      border: 1px solid #000000;
      background-color: #ffffff;
      color: #000000;
    }

    /* High contrast answer highlight for B&W mode */
    .word-cell.found.bw-mode {
      background-color: #d1d5db !important;
      color: #000000 !important;
      font-weight: 900 !important;
      outline: 2px solid #000000;
      z-index: 10;
    }

    /* Color answer highlight */
    .word-cell.found.color-mode {
      background-color: #fef08a !important; /* Soft yellow highlight */
      color: #000000 !important;
      font-weight: 900 !important;
      outline: 2px solid #000000;
      z-index: 10;
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: #ffffff !important;
        padding: 0 !important;
      }
      .page-break {
        page-break-after: always;
        break-after: page;
      }
      .word-cell {
        font-size: 1rem !important;
      }
      /* Ensure colors print properly if selected */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- TOP CONTROL PANEL (HIDDEN IN PRINT) -->
  <div class="no-print max-w-4xl mx-auto mb-8 bg-white p-6 rounded-xl border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
    <div class="flex items-center justify-between border-b-2 border-black pb-4 mb-6">
      <h1 class="text-2xl font-bold font-heading flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Custom Word Search Generator
      </h1>
      <button onclick="window.print()" class="bg-black text-white hover:bg-gray-800 font-bold py-2 px-4 rounded-lg flex items-center gap-2 border-2 border-black">
        <i class="fa-solid fa-print"></i> Print / Save as PDF
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- INPUT WORDS -->
      <div>
        <label class="block font-bold mb-2">Enter Words (Comma or line separated):</label>
        <textarea id="wordsInput" rows="7" class="w-full p-3 border-2 border-black rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-black" placeholder="KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL">KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL</textarea>
        
        <div class="mt-2 flex flex-wrap gap-2">
          <span class="text-xs font-bold self-center">Presets:</span>
          <button onclick="loadPreset('year2')" class="text-xs bg-gray-200 hover:bg-gray-300 font-bold py-1 px-2 rounded border border-black">Year 2 Spelling</button>
          <button onclick="loadPreset('phonics')" class="text-xs bg-gray-200 hover:bg-gray-300 font-bold py-1 px-2 rounded border border-black">Phase 5 Phonics</button>
          <button onclick="loadPreset('animals')" class="text-xs bg-gray-200 hover:bg-gray-300 font-bold py-1 px-2 rounded border border-black">Animals</button>
        </div>
      </div>

      <!-- OPTIONS -->
      <div class="flex flex-col justify-between space-y-3">
        <div>
          <div class="grid grid-cols-2 gap-2 mb-3">
            <div>
              <label class="block font-bold mb-1 text-sm">Color Mode:</label>
              <select id="colorTheme" class="w-full p-2 border-2 border-black rounded-lg font-bold bg-white text-sm" onchange="generateSheets()">
                <option value="bw" selected>Black & White (High Contrast)</option>
                <option value="color">Playful Color</option>
              </select>
            </div>
            <div>
              <label class="block font-bold mb-1 text-sm">Number of Puzzles:</label>
              <select id="sheetCount" class="w-full p-2 border-2 border-black rounded-lg font-bold bg-white text-sm">
                <option value="1">1 Puzzle</option>
                <option value="3">3 Themed Puzzles</option>
                <option value="5" selected>5 Themed Puzzles</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 mb-3">
            <div>
              <label class="block font-bold mb-1 text-sm">Grid Size:</label>
              <select id="gridSize" class="w-full p-2 border-2 border-black rounded-lg font-bold bg-white text-sm">
                <option value="12">12 x 12 (Easier)</option>
                <option value="15" selected>15 x 15 (Standard)</option>
              </select>
            </div>
            <div>
              <label class="block font-bold mb-1 text-sm">Letter Case:</label>
              <select id="letterCase" class="w-full p-2 border-2 border-black rounded-lg font-bold bg-white text-sm">
                <option value="upper" selected>UPPERCASE</option>
                <option value="lower">lowercase</option>
              </select>
            </div>
          </div>
        </div>

        <div class="flex gap-3">
          <button onclick="generateSheets()" class="flex-1 bg-black text-white font-bold py-3 px-4 rounded-lg border-2 border-black hover:bg-gray-800 transition">
            <i class="fa-solid fa-rotate"></i> Generate Puzzles
          </button>
          <button id="ansBtn" onclick="toggleAnswers()" class="bg-gray-200 text-black font-bold py-3 px-4 rounded-lg border-2 border-black hover:bg-gray-300">
            Show Answers
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTAINER FOR GENERATED PUZZLES -->
  <div id="sheetsContainer" class="max-w-3xl mx-auto space-y-8"></div>

  <script>
    const THEMES = [
      { 
        name: "Jungle Safari", 
        icon: "fa-compass", 
        desc: "Search through the wild jungle!",
        headerBg: "bg-emerald-700 text-white",
        badgeBg: "bg-emerald-100 text-emerald-900 border-emerald-900",
        border: "border-emerald-900",
        cardBg: "bg-emerald-50",
        itemBg: "bg-emerald-100/80 border-emerald-800"
      },
      { 
        name: "Space Explorer", 
        icon: "fa-rocket", 
        desc: "Find hidden words in the stars!",
        headerBg: "bg-indigo-800 text-white",
        badgeBg: "bg-indigo-100 text-indigo-900 border-indigo-900",
        border: "border-indigo-900",
        cardBg: "bg-indigo-50",
        itemBg: "bg-indigo-100/80 border-indigo-800"
      },
      { 
        name: "Under the Sea", 
        icon: "fa-water", 
        desc: "Dive deep into the ocean grid!",
        headerBg: "bg-sky-600 text-white",
        badgeBg: "bg-sky-100 text-sky-900 border-sky-900",
        border: "border-sky-900",
        cardBg: "bg-sky-50",
        itemBg: "bg-sky-100/80 border-sky-800"
      },
      { 
        name: "Detective Sleuth", 
        icon: "fa-magnifying-glass", 
        desc: "Solve the mystery word search!",
        headerBg: "bg-amber-800 text-white",
        badgeBg: "bg-amber-100 text-amber-900 border-amber-900",
        border: "border-amber-900",
        cardBg: "bg-amber-50",
        itemBg: "bg-amber-100/80 border-amber-800"
      },
      { 
        name: "Castle & Knights", 
        icon: "fa-shield-halved", 
        desc: "A quest for secret spellings!",
        headerBg: "bg-rose-800 text-white",
        badgeBg: "bg-rose-100 text-rose-900 border-rose-900",
        border: "border-rose-900",
        cardBg: "bg-rose-50",
        itemBg: "bg-rose-100/80 border-rose-800"
      }
    ];

    let showAnswers = false;

    const PRESETS = {
      year2: "KEY, DONKEY, HOCKEY, FACE, CITY, SLICE, PENCIL, FOSSIL, NOSTRIL",
      phonics: "CAMEL, TUNNEL, SQUIRREL, DOLPHIN, PHONICS, ELEPHANT, NEPHEW, TROPHY",
      animals: "TIGER, GIRAFFE, ELEPHANT, MONKEY, PANDA, KANGAROO, ZEBRA, LION"
    };

    function loadPreset(key) {
      document.getElementById('wordsInput').value = PRESETS[key];
      generateSheets();
    }

    function toggleAnswers() {
      showAnswers = !showAnswers;
      const btn = document.getElementById('ansBtn');
      btn.innerText = showAnswers ? "Hide Answers" : "Show Answers";
      btn.className = showAnswers 
        ? "bg-black text-white font-bold py-3 px-4 rounded-lg border-2 border-black" 
        : "bg-gray-200 text-black font-bold py-3 px-4 rounded-lg border-2 border-black hover:bg-gray-300";
      
      const isColor = document.getElementById('colorTheme').value === 'color';
      document.querySelectorAll('.word-cell').forEach(cell => {
        if (cell.dataset.isWord === "true") {
          cell.classList.toggle('found', showAnswers);
          cell.classList.toggle(isColor ? 'color-mode' : 'bw-mode', showAnswers);
        }
      });
    }

    function parseWords(isLower) {
      const raw = document.getElementById('wordsInput').value;
      return raw
        .split(/[\n,]+/)
        .map(w => {
          let cleaned = w.trim().replace(/[^a-zA-Z]/g, '');
          return isLower ? cleaned.toLowerCase() : cleaned.toUpperCase();
        })
        .filter(w => w.length > 1 && w.length <= 15);
    }

    function createEmptyGrid(size) {
      return Array(size).fill(null).map(() => Array(size).fill(''));
    }

    function placeWord(grid, solutionMask, word) {
      const size = grid.length;
      const directions = [
        { r: 0, c: 1 },  // Horizontal
        { r: 1, c: 0 }   // Vertical
      ];

      let placed = false;
      let attempts = 0;

      while (!placed && attempts < 100) {
        attempts++;
        const dir = directions[Math.floor(Math.random() * directions.length)];
        const startR = Math.floor(Math.random() * (dir.r === 1 ? size - word.length + 1 : size));
        const startC = Math.floor(Math.random() * (dir.c === 1 ? size - word.length + 1 : size));

        let canPlace = true;
        for (let i = 0; i < word.length; i++) {
          const r = startR + i * dir.r;
          const c = startC + i * dir.c;
          if (grid[r][c] !== '' && grid[r][c] !== word[i]) {
            canPlace = false;
            break;
          }
        }

        if (canPlace) {
          for (let i = 0; i < word.length; i++) {
            const r = startR + i * dir.r;
            const c = startC + i * dir.c;
            grid[r][c] = word[i];
            solutionMask[r][c] = true;
          }
          placed = true;
        }
      }
      return placed;
    }

    function fillRandomLetters(grid, isLower) {
      const letters = isLower ? "abcdefghijklmnopqrstuvwxyz" : "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const size = grid.length;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (grid[r][c] === '') {
            grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }
    }

    function generateSheets() {
      const letterCase = document.getElementById('letterCase').value;
      const isLower = letterCase === 'lower';
      const colorMode = document.getElementById('colorTheme').value;
      const isColor = colorMode === 'color';

      const words = parseWords(isLower);
      const count = parseInt(document.getElementById('sheetCount').value);
      const size = parseInt(document.getElementById('gridSize').value);
      const container = document.getElementById('sheetsContainer');

      if (words.length === 0) {
        alert("Please enter at least one valid word!");
        return;
      }

      container.innerHTML = '';

      for (let s = 0; s < count; s++) {
        const theme = THEMES[s % THEMES.length];
        const grid = createEmptyGrid(size);
        const solutionMask = createEmptyGrid(size).map(r => r.map(() => false));

        const placedWords = [];
        words.forEach(word => {
          if (placeWord(grid, solutionMask, word)) {
            placedWords.push(word);
          }
        });

        fillRandomLetters(grid, isLower);

        // Build HTML
        const sheetEl = document.createElement('div');
        const borderColor = isColor ? theme.border : 'border-black';
        sheetEl.className = `bg-white p-6 border-4 ${borderColor} rounded-xl page-break mb-8 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]`;

        let gridHtml = `<div class="grid gap-1 mb-6" style="grid-template-columns: repeat(${size}, minmax(0, 1fr));">`;
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const isWord = solutionMask[r][c];
            const foundClass = (isWord && showAnswers) ? `found ${isColor ? 'color-mode' : 'bw-mode'}` : '';
            gridHtml += `<div class="word-cell rounded ${foundClass}" data-is-word="${isWord}">${grid[r][c]}</div>`;
          }
        }
        gridHtml += `</div>`;

        const listBg = isColor ? theme.cardBg : 'bg-gray-50';
        let wordsListHtml = `<div class="grid grid-cols-3 gap-3 border-2 ${borderColor} p-4 rounded-lg ${listBg}">`;
        placedWords.forEach(w => {
          const itemBg = isColor ? theme.itemBg : 'bg-white border-black';
          wordsListHtml += `
            <div class="flex items-center gap-2 font-bold text-sm p-1.5 rounded border ${itemBg}">
              <div class="w-4 h-4 border-2 border-black rounded-sm bg-white"></div>
              <span>${w}</span>
            </div>`;
        });
        wordsListHtml += `</div>`;

        const headerClass = isColor ? theme.headerBg : 'border-b-4 border-black pb-4';
        const badgeClass = isColor ? theme.badgeBg : 'bg-black text-white';

        sheetEl.innerHTML = `
          <!-- HEADER -->
          <div class="${isColor ? 'p-4 rounded-lg mb-4 flex justify-between items-center ' + headerClass : 'border-b-4 border-black pb-4 mb-4 flex justify-between items-end'}">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider ${badgeClass} px-2 py-0.5 rounded border">Year 2 Activity Sheet</span>
              <h2 class="text-2xl font-black font-heading flex items-center gap-2 mt-1">
                <i class="fa-solid ${theme.icon}"></i> ${theme.name} Word Search
              </h2>
              <p class="text-xs font-bold ${isColor ? 'opacity-90' : 'text-gray-600'}">${theme.desc}</p>
            </div>
            <div class="text-right border-2 ${isColor ? 'border-white/50 bg-white/10' : 'border-black'} p-2 rounded-lg text-xs font-bold">
              <div>Name: ____________________</div>
              <div class="mt-1">Date: ____________________</div>
            </div>
          </div>

          <!-- GRID -->
          ${gridHtml}

          <!-- WORD LIST -->
          <div class="mt-4">
            <h3 class="font-bold text-sm mb-2 font-heading flex items-center gap-1">
              <i class="fa-solid fa-list-check"></i> WORDS TO FIND (${placedWords.length}):
            </h3>
            ${wordsListHtml}
          </div>
        `;
